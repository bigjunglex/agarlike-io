syntax = "proto3";

package packets;
option go_package = "pkg/packets";

message ChatMessage {
  string msg = 1;
}

message IdAssign {
  uint64 id = 1;
}

message DirectionUpdate {
  float direction = 1;
}

message Packet {
  uint64 sender_id = 1;
  oneof msg {
    ChatMessage chat = 2;
    IdAssign    id   = 3;
    DirectionUpdate dir = 4;
  }
}